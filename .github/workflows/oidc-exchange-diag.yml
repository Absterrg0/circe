name: OIDC exchange diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Exchange OIDC id token for a package publish token
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_ACTIONS=${GITHUB_ACTIONS:-unset}"
          echo "node: $(node --version)  npm(before): $(npm --version)"
          npm install --global npm@latest >/dev/null 2>&1
          echo "npm(after): $(npm --version)"
          id_token_json="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org")"
          id_token="$(printf '%s' "$id_token_json" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>process.stdout.write(JSON.parse(d).value))')"
          echo "::add-mask::$id_token"
          echo "id token length: ${#id_token}"
          code="$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@absterrg0%2Fcirce")"
          echo "exchange http: $code"
          echo "--- exchange body ---"
          cat "$RUNNER_TEMP/exchange.json"
          echo
